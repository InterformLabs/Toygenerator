<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Interform Tap Toys</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky live preview (toy + phone) on the right, five numbered build steps on the left; on phones the toy preview sticks to the top. */
:root{
  --bg:#eceee9; --surface:#f8f9f6; --ink:#141915; --muted:#58625b; --line:#d3d8d0;
  --accent:#2250e0; --accent-ink:#ffffff; --stage:#dfe3da; --phone:#141915; --chip:#e2e6df; --ok:#1f7a4d; --warn:#b3402a;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"DM Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101411; --surface:#181d19; --ink:#eef1ec; --muted:#9aa59d; --line:#2b332d;
  --accent:#8aa5ff; --accent-ink:#0b1020; --stage:#1b211c; --phone:#050706; --chip:#222924; --ok:#58c58d; --warn:#ff8a6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101411; --surface:#181d19; --ink:#eef1ec; --muted:#9aa59d; --line:#2b332d;
  --accent:#8aa5ff; --accent-ink:#0b1020; --stage:#1b211c; --phone:#050706; --chip:#222924; --ok:#58c58d; --warn:#ff8a6e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:13px}
.lang{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:5px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.intro{max-width:760px;margin-bottom:30px}
.intro h1{font-size:clamp(34px,6vw,60px);font-weight:700;line-height:1.02}
.intro p{color:var(--muted);font-size:17px;margin:14px 0 0;max-width:60ch}
.note{display:inline-block;margin-top:16px;background:var(--chip);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:36px;align-items:start}
.left{display:flex;flex-direction:column;gap:34px;min-width:0}
aside{position:sticky;top:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.step h2{font-size:23px;font-weight:650;display:flex;align-items:baseline;gap:10px}
.step h2 b{font-size:13px;font-weight:600;color:var(--muted);font-family:var(--body);min-width:18px}
.step>p.hint{color:var(--muted);margin:4px 0 14px 28px;max-width:56ch}
.opts{display:grid;gap:10px}
.o4{grid-template-columns:repeat(4,minmax(0,1fr))}
.o3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.opt strong{font-family:var(--display);font-size:16px;font-weight:650}
.opt span.s{color:var(--muted);font-size:13px;line-height:1.35}
.opt svg{width:44px;height:44px;color:var(--ink)}
.tag{align-self:flex-start;font-size:11px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 6px}
.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.shape{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.shape svg{width:46px;height:46px;color:var(--ink)}
.shape[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent);color:var(--ink)}
.sub{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--chip);border:1.5px solid transparent;border-radius:999px;padding:6px 14px;font-size:14px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sub p{margin:10px 0 0;color:var(--muted);font-size:13.5px}
.file{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.ghost{background:none;border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.addons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.addons label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.addons label.off{opacity:.5}
.addons input{margin-top:3px;accent-color:var(--accent)}
.addons small{display:block;color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.act{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;text-align:left;align-items:flex-start;min-width:0}
.act[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.act svg{width:30px;height:30px;flex:none;color:var(--accent)}
.act strong{display:block;font-size:14.5px;font-weight:600;line-height:1.25}
.act span{display:block;color:var(--muted);font-size:12.5px;line-height:1.3;margin-top:2px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=email],input[type=number],textarea,select{font:inherit;font-size:15px;font-weight:400;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
.cta{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px 22px;font-family:var(--display);font-size:18px;font-weight:650;width:100%}
.err{color:var(--warn);font-size:13.5px;min-height:20px;margin:6px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stage{background:var(--stage);border-radius:12px;height:340px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage svg{height:100%;width:auto;max-width:100%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.stage.glow svg{filter:drop-shadow(0 0 7px #7dffb4) drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.stage svg .toy{transform-origin:50% 50%}
.stage.bump svg .toy{animation:bump .5s ease}
@keyframes bump{30%{transform:scale(1.05) rotate(-2deg)}100%{transform:none}}
.cap{margin:10px 2px 0;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:10px}
.phonecard{display:flex;flex-direction:column;align-items:center;gap:12px}
.phone{width:218px;aspect-ratio:9/18.5;background:var(--phone);border-radius:34px;padding:7px;position:relative}
.phone::before{content:"";position:absolute;left:50%;top:13px;width:56px;height:14px;background:var(--phone);border-radius:9px;transform:translateX(-50%);z-index:3}
.screen{width:100%;height:100%;border-radius:28px;overflow:hidden;position:relative;background:#111}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:44px 18px 22px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.scr h4{font-size:21px;line-height:1.1;font-weight:700}
.scr .k{margin:0;font-size:11px;letter-spacing:.06em;opacity:.8}
.scr .b{margin:0;font-size:13.5px;line-height:1.4}
.scr .ft{margin:0;font-size:11.5px;opacity:.75}
.scr .big{font-family:var(--display);font-size:68px;line-height:1;font-weight:800}
.scr button{border:0;border-radius:999px;padding:8px 18px;font-weight:600;font-size:13px;background:#fff;color:#111}
.scr .pair{display:flex;gap:10px;position:relative;min-height:36px;align-items:center}
.scr .bar{width:100%;height:7px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden}
.scr .bar i{display:block;height:100%;background:#fff;border-radius:5px}
.scr svg{max-width:100%}
.shake{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:translate(4px,-3px)}75%{transform:translate(-4px,3px)}}
.idle{background:linear-gradient(#27304a,#10131f);color:#fff}
.idle .time{font-family:var(--display);font-size:50px;font-weight:600}
.row2{display:flex;gap:10px;align-items:center;justify-content:center}
.sum dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px}
.sum dt{color:var(--muted)}
.sum dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.total b{font-family:var(--display);font-size:30px;font-weight:700}
.small{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.done{background:var(--surface);border:1.5px solid var(--ok);border-radius:14px;padding:18px;margin-top:16px}
.done h3{font-size:22px;color:var(--ok)}
.done p{margin:6px 0 0}
.foot{margin-top:40px;color:var(--muted);font-size:13px;max-width:70ch}
.custom{margin-top:12px}
.chk{display:flex;gap:10px;align-items:center;font-size:14.5px}
.chk input{accent-color:var(--accent);width:18px;height:18px}
@media (max-width:900px){
  .app{display:flex;flex-direction:column;gap:30px}
  .left,aside{display:contents}
  .stage-card{order:-1;position:sticky;top:0;z-index:20;margin:0 -4px;padding:8px}
  .stage{height:34vh;min-height:190px}
  .stage-card .cap{display:none}
  #steps{order:0}.phonecard{order:1}.sum{order:2}#order{order:3}
  .o4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .o3{grid-template-columns:1fr}
  .acts{grid-template-columns:1fr}
  .addons,.fields{grid-template-columns:1fr}
  .step>p.hint{margin-left:0}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
  .stage-card{top:env(safe-area-inset-top,0px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

</head><body>
<div class="wrap">
  <div class="top">
    <span class="brand">INTERFORM</span>
    <div class="lang" role="group" aria-label="Language"><button data-a="lang" data-v="en" aria-pressed="true">EN</button><button data-a="lang" data-v="ua" aria-pressed="false">UA</button></div>
  </div>
  <div class="intro">
    <h1 data-t="h1"></h1>
    <p data-t="lead"></p>
    <span class="note" data-t="concept"></span>
  </div>

  <div class="app">
    <div class="left">
      <div id="steps" style="display:flex;flex-direction:column;gap:34px">
        <section class="step"><h2><b>1</b><span data-t="s1"></span></h2><p class="hint" data-t="s1h"></p><div class="opts o4" id="formOpts"></div></section>
        <section class="step"><h2><b>2</b><span data-t="s2"></span></h2><p class="hint" data-t="s2h"></p><div class="shapes" id="shapeGrid"></div></section>
        <section class="step"><h2><b>3</b><span data-t="s3"></span></h2><p class="hint" data-t="s3h"></p>
          <div class="opts o3" id="finishOpts"></div><div class="sub" id="finishPanel"></div>
          <div class="fields" style="margin-top:14px">
            <label class="f" for="inText"><span data-t="lText"></span><input type="text" id="inText" maxlength="18" value="Merry Xmas"></label>
            <label class="f" for="inSub"><span data-t="lSub"></span><input type="text" id="inSub" maxlength="14" value="2026"></label>
          </div>
          <div class="addons" id="addons"></div>
        </section>
        <section class="step"><h2><b>4</b><span data-t="s4"></span></h2><p class="hint" data-t="s4h"></p>
          <div class="chips" id="catChips"></div><div class="acts" id="actGrid"></div>
          <div class="fields" style="margin-top:14px" id="msgFields">
            <label class="f" for="inTo"><span data-t="lTo"></span><input type="text" id="inTo" maxlength="20" value="Anna"></label>
            <label class="f" for="inFrom"><span data-t="lFrom"></span><input type="text" id="inFrom" maxlength="20" value="Max"></label>
            <label class="f full" for="inMsg" id="msgWrap"><span data-t="lMsg"></span><textarea id="inMsg" maxlength="160"></textarea></label>
          </div>
        </section>
      </div>

      <section class="step" id="order"><h2><b>5</b><span data-t="s5"></span></h2><p class="hint" data-t="s5h"></p>
        <form id="orderForm" novalidate>
          <div class="fields">
            <label class="f" for="inName"><span data-t="lName"></span><input type="text" id="inName" autocomplete="name"></label>
            <label class="f" for="inEmail"><span data-t="lEmail"></span><input type="email" id="inEmail" autocomplete="email"></label>
            <label class="f" for="inQty"><span data-t="lQty"></span><input type="number" id="inQty" min="1" max="50" value="1"></label>
            <label class="f" for="inShip"><span data-t="lShip"></span><select id="inShip"></select></label>
          </div>
          <div class="custom"><label class="chk"><input type="checkbox" id="inCustom"><span data-t="lCustom"></span></label>
            <label class="f" for="inIdea" id="ideaWrap" hidden style="margin-top:10px"><span data-t="lIdea"></span><textarea id="inIdea" maxlength="400"></textarea></label></div>
          <p class="err" id="err" role="alert"></p>
          <button class="cta" type="submit" data-t="place"></button>
          <p class="small" data-t="cutoff"></p>
        </form>
        <div id="confirm"></div>
      </section>
    </div>

    <aside>
      <div class="card stage-card">
        <div class="stage" id="stage"></div>
        <div class="cap"><span id="capL"></span><span id="capR"></span></div>
      </div>
      <div class="card phonecard">
        <div class="phone"><div class="screen" id="screen"></div></div>
        <button class="ghost" data-a="tap" data-t="tap"></button>
        <p class="small" style="text-align:center;margin:0" data-t="noapp"></p>
      </div>
      <div class="card sum"><dl id="sumList"></dl><div class="total"><span data-t="total"></span><b id="price"></b></div><p class="small" id="priceNote"></p></div>
    </aside>
  </div>
  <p class="foot" data-t="foot"></p>
</div>

function fitText(){
  var svg=$("stage").querySelector("svg");if(!svg)return;
  var fr=svg.querySelectorAll("g[data-frag] > *"),tx=svg.querySelectorAll("text");
  if(!fr.length||!tx.length||!tx[0].parentNode.getCTM)return;
  var T=tx[0].parentNode.getCTM(),inv=[];
  for(var i=0;i<fr.length;i++)inv.push(fr[i].getCTM().inverse().multiply(T));
  var base=[],mainY=null,mainFs=0;
  for(i=0;i<tx.length;i++){var main=tx[i].getAttribute("font-weight")==="800";var b={el:tx[i],fs:parseFloat(tx[i].getAttribute("font-size")),y:parseFloat(tx[i].getAttribute("y")),main:main,emb:main&&tx[i].getAttribute("opacity")===".28"};base.push(b);if(main&&mainY===null&&!b.emb){mainY=b.y;mainFs=b.fs;}}
  if(mainY===null){mainY=base[0].y;mainFs=0;}
  function inside(x,y){for(var j=0;j<fr.length;j++){var p=new DOMPoint(x,y).matrixTransform(inv[j]);try{if(fr[j].isPointInFill(p))return true;}catch(e){return true;}}return false;}
  for(var s=1;s>=0.3;s*=0.93){
    var ok=true;
    for(i=0;i<base.length;i++){var b2=base[i];b2.el.setAttribute("font-size",(b2.fs*s).toFixed(2));
      if(!b2.main)b2.el.setAttribute("y",(mainY+mainFs*s*0.75+1).toFixed(2));
      var bb=b2.el.getBBox(),xs=[bb.x,bb.x+bb.width/2,bb.x+bb.width],ys=[bb.y+bb.height*0.2,bb.y+bb.height*0.9];
      for(var a=0;a<3&&ok;a++)for(var c=0;c<2&&ok;c++)if(!inside(xs[a],ys[c]))ok=false;
    }
    if(ok)break;
  }
}

function bind(id,fn){$(id).addEventListener("input",fn);}
bind("inText",function(e){st.text=e.target.value;renderToy();renderSummary();});
bind("inSub",function(e){st.sub=e.target.value;renderToy();renderSummary();});
bind("inTo",function(e){st.to=e.target.value;showScreen(false);});
bind("inFrom",function(e){st.from=e.target.value;showScreen(false);});
bind("inMsg",function(e){st.msg[st.action]=e.target.value;showScreen(false);});
bind("inQty",function(){renderSummary();});
$("inCustom").addEventListener("change",function(e){st.custom=e.target.checked;$("ideaWrap").hidden=!st.custom;renderSummary();});
$("orderForm").addEventListener("submit",function(e){
  e.preventDefault();var name=$("inName").value.trim(),mail=$("inEmail").value.trim(),er=$("err"),c=$("confirm");er.textContent="";c.innerHTML="";
  if(!name){er.textContent=t("e1");$("inName").focus();return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){er.textContent=t("e2");$("inEmail").focus();return;}
  if(st.custom&&!$("inIdea").value.trim()){er.textContent=t("e3");$("inIdea").focus();return;}
  var pr=price(),id="TT-"+Math.floor(1000+Math.random()*9000);
  c.innerHTML='<div class="done" role="status"><h3>'+t("okT")+'</h3><p><b>'+id+'</b> &middot; '+esc(name)+' &middot; '+money(pr.tot)+'</p><p>'+t("okP")+'</p></div>';
  c.scrollIntoView({behavior:"smooth",block:"center"});
});

renderAll();
})();
</script>

</body></html>
