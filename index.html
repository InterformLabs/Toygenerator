<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Interform Tap Toys</title>
<meta name="description" content="Design a tap toy: pick a shape, a look and what opens on their phone. Made by hand in Vancouver.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Colour rule: white and ink are mixed for every grey; evergreen is the only colour, used for what is selected and for buying. */
:root{
--white:#ffffff; --ink:#202322; --signal:#0e6b4f;
--tile:#f3f3f1; --tile2:#ebebe8; --line:#e2e2df; --muted:#6b6f6d; --soft:#e4f0ea;
--ok:#0e6b4f; --warn:#b4321e;
--f:"Onest","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;
padding:0 max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:28px}
.brand{font-weight:600;font-size:16px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-weight:400}
.lang{display:flex;gap:2px}
.lang button{border:0;background:none;padding:4px 8px;font-size:14px;color:var(--muted)}
.lang button[aria-pressed="true"]{color:var(--ink);font-weight:600}

.app{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:56px;align-items:start}

/* product tile */
.stagewrap{position:sticky;top:20px}
.stage{position:relative;background:var(--tile);border-radius:22px;aspect-ratio:1/1;max-height:calc(100vh - 150px);width:100%;overflow:hidden}
.toyview{position:absolute;top:0;bottom:0;left:0;right:30%;display:flex;align-items:center;justify-content:center;padding:6% 2% 6% 5%}
.toyview svg{height:100%;width:auto;max-width:100%;filter:drop-shadow(0 10px 18px rgba(32,35,34,.18))}
.toyview svg .toy{transform-origin:50% 50%}
.bump .toyview svg .toy{animation:bump .45s ease}
@keyframes bump{35%{transform:scale(1.04)}100%{transform:none}}
.edit .toyview{cursor:grab;touch-action:none}
.edit .toyview:active{cursor:grabbing}
.hint{position:absolute;left:35%;bottom:62px;transform:translateX(-50%);background:var(--white);color:var(--ink);font-size:13px;border-radius:999px;padding:6px 14px;max-width:90%;text-align:center;pointer-events:none;display:none;box-shadow:0 1px 2px rgba(32,35,34,.12)}
.edit .hint{display:block}
.phoneview{position:absolute;right:5%;top:50%;transform:translateY(-50%) rotate(-6deg);pointer-events:none;z-index:2}
.phone{pointer-events:auto}
.waves{position:absolute;top:50%;width:34px;height:52px;color:var(--signal);transform:translateY(-50%);opacity:.25;transition:opacity .2s;pointer-events:none;z-index:1}

@keyframes wv{0%,100%{opacity:.25}50%{opacity:1}}
.tapping .phoneview{animation:tapin 1.6s cubic-bezier(.45,0,.25,1)}
@keyframes tapin{0%,100%{transform:translateY(-50%) rotate(-6deg)}32%,62%{transform:translateY(-50%) translateX(var(--tapx,-120px)) rotate(-14deg) scale(.97)}}
.tapping .waves{opacity:0}
.phbox{position:relative}
.phone{width:218px;height:448px;background:#202322;border-radius:34px;padding:7px;position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 18px 30px rgba(32,35,34,.18)}
.phone::before{content:"";position:absolute;left:50%;top:13px;width:56px;height:14px;background:#202322;border-radius:9px;transform:translateX(-50%);z-index:3}
.screen{width:100%;height:100%;border-radius:28px;overflow:hidden;position:relative;background:#111}
.zoombtn{position:absolute;left:14px;top:14px;z-index:3;border:1px solid var(--line);background:var(--white);border-radius:999px;padding:7px 14px 7px 10px;font-size:14px;display:flex;gap:7px;align-items:center}
.zoombtn svg{width:18px;height:18px}
.again{position:absolute;left:14px;bottom:14px;z-index:3;border:1px solid var(--line);background:var(--white);border-radius:999px;padding:7px 16px;font-size:14px;display:flex;gap:8px;align-items:center}
.again svg{width:18px;height:18px}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:44px 18px 22px;animation:in .35s ease;font-family:var(--f)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.scr h4{margin:0;font-size:21px;line-height:1.1;font-weight:700}
.scr .k{margin:0;font-size:11px;opacity:.8}
.scr .b{margin:0;font-size:13.5px;line-height:1.4}
.scr .ft{margin:0;font-size:11.5px;opacity:.75}
.scr .big{font-size:68px;line-height:1;font-weight:700}
.scr button{border:0;border-radius:999px;padding:8px 18px;font-weight:600;font-size:13px;background:#fff;color:#111}
.scr .pair{display:flex;gap:10px;position:relative;min-height:36px;align-items:center}
.scr .bar{width:100%;height:7px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden}
.scr .bar i{display:block;height:100%;background:#fff;border-radius:5px}
.scr svg{max-width:100%}
.shake{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:translate(4px,-3px)}75%{transform:translate(-4px,3px)}}
.idle{background:#26292a;color:#fff}
.idle .time{font-size:50px;font-weight:500}
.ring{position:absolute;width:90px;height:90px;border:2px solid #fff;animation-delay:.5s;border-radius:50%;animation:ring 1s ease-out infinite;opacity:0}
@keyframes ring{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.4);opacity:0}}
.view{display:flex;gap:10px;margin-top:12px}
.view button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--white);border-radius:14px;padding:8px 14px 8px 8px;font-size:14px;color:var(--muted)}
.view button i{width:40px;height:40px;border-radius:10px;background:var(--tile);display:flex;align-items:center;justify-content:center}
.view button svg{width:22px;height:22px;color:var(--ink)}
.view button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.setbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.setlbl{font-size:14px;font-weight:500;margin-right:2px}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{position:relative;width:44px;height:44px;border:1px solid var(--line);background:var(--tile);border-radius:12px;padding:6px}
.slot svg{width:100%;height:100%}
.slot i{position:absolute;right:-5px;top:-6px;font-style:normal;font-size:11px;font-weight:600;background:var(--white);border:1px solid var(--line);border-radius:999px;min-width:18px;height:18px;line-height:16px;text-align:center}
.slot[aria-pressed="true"]{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal);background:var(--white)}
.slot[aria-pressed="true"] i{background:var(--signal);color:#fff;border-color:var(--signal)}
.addp{display:flex;align-items:center;gap:6px;border:1px dashed #b9b9b4;background:none;border-radius:12px;height:44px;padding:0 12px;font-size:14px;color:var(--ink)}
.addp svg{width:16px;height:16px}
.rmp{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px}
.cap{font-size:13.5px;color:var(--muted)}

/* product column */
.builder{display:flex;flex-direction:column;min-width:0}
.intro .kicker{margin:0 0 6px;font-size:14px;color:var(--signal);font-weight:500}
.intro h1{font-size:clamp(28px,3.4vw,40px);font-weight:600;letter-spacing:-.025em}
.intro p{margin:10px 0 0;color:var(--muted);font-size:16.5px;max-width:48ch}
.pricebig{margin-top:18px;font-size:24px;font-weight:600;letter-spacing:-.01em}
.pricebig small{font-size:14px;color:var(--muted);font-weight:400;margin-left:8px}
.step{border-top:1px solid var(--line);padding:24px 0}
.step:first-of-type{margin-top:26px}
.step h2{font-size:17px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.step h2 .val{font-size:15px;font-weight:400;color:var(--muted);text-align:right}
.step .hint2{color:var(--muted);margin:4px 0 0;font-size:14.5px}
.step .body{margin-top:14px}

.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.type{border:1px solid var(--line);background:var(--white);border-radius:14px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.type svg{width:32px;height:32px}
.type strong{font-size:15.5px;font-weight:500;line-height:1.2}
.type small{font-size:13.5px;color:var(--muted)}
.type:hover{border-color:#c9c9c5}
.type[aria-pressed="true"]{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}

.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.shape{border:1px solid transparent;background:var(--tile);border-radius:12px;padding:10px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.shape svg{width:34px;height:34px;color:var(--ink)}
.shape:hover{background:var(--tile2)}
.shape[aria-pressed="true"]{background:var(--white);border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal);color:var(--ink)}

.tabs{display:inline-flex;background:var(--tile);border-radius:12px;padding:3px;gap:2px}
.tab{border:0;background:none;padding:8px 14px;border-radius:9px;font-size:14.5px;font-weight:500;color:var(--muted);display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--white);color:var(--ink);box-shadow:0 1px 2px rgba(32,35,34,.14)}
.tag{font-size:11px;font-weight:500;background:var(--soft);color:var(--signal);border-radius:6px;padding:1px 6px}
.panel{padding-top:16px}
.panel p.note{margin:12px 0 0;color:var(--muted);font-size:14px}
.sw{display:flex;flex-wrap:wrap;gap:12px}
.sw button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(32,35,34,.15);padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--white),0 0 0 4.5px var(--signal)}
.woods{display:flex;gap:18px}
.wood{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.wood i{display:block;width:48px;height:48px;border-radius:50%;border:1px solid rgba(32,35,34,.15)}
.wood[aria-pressed="true"]{color:var(--ink)}
.wood[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--white),0 0 0 4.5px var(--signal)}
.upl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.file{position:relative;display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--white);border-radius:999px;padding:10px 18px;font-weight:500;font-size:15px;cursor:pointer}
.file svg{width:18px;height:18px}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file:focus-within{outline:2px solid var(--signal);outline-offset:2px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:9px 17px;font-size:15px}
.zoom{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:14px;color:var(--muted)}
.zoom input{flex:1;accent-color:var(--signal)}
.zoom button{border:0;background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:4px}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
input[type=text],input[type=email],input[type=number],textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--white);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--ink);outline:none}
textarea{min-height:84px;resize:vertical}
.textrow{margin-top:20px}

.ex{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ex:last-child{border-bottom:0}
.ex span{flex:1;min-width:0}
.ex strong{display:block;font-weight:500;font-size:15.5px}
.ex small{display:block;color:var(--muted);font-size:13.5px}
.ex em{font-style:normal;font-size:14.5px;color:var(--muted)}
.ex input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:var(--tile2);position:relative;margin:0;flex:none;cursor:pointer;transition:background .15s}
.ex input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.ex input:checked{background:var(--signal)}
.ex input:checked::after{left:21px}
.ex.off{opacity:.45;cursor:default}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--tile);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.act{width:100%;border:0;border-bottom:1px solid var(--line);background:none;display:flex;gap:12px;align-items:center;text-align:left;padding:11px 0}
.act:last-child{border-bottom:0}
.act .ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--tile);display:flex;align-items:center;justify-content:center}
.act .ic svg{width:20px;height:20px;color:var(--ink)}
.act span.t{flex:1;min-width:0}
.act strong{display:block;font-weight:500;font-size:15.5px;line-height:1.25}
.act small{display:block;color:var(--muted);font-size:13.5px}
.act .dot{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid #c9c9c5}
.act[aria-pressed="true"] .dot{border:6px solid var(--signal)}
.act[aria-pressed="true"] .ic{background:var(--soft)}
.act[aria-pressed="true"] .ic svg{color:var(--signal)}
#msgFields{margin-top:16px}

.packs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 18px}
.pack{position:relative;border:1px solid var(--line);background:var(--white);border-radius:14px;padding:16px 14px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.pack strong{font-weight:500;font-size:15.5px}
.pack b{font-size:24px;font-weight:600;line-height:1.2}
@media (max-width:420px){.pack{padding:14px 10px 10px}.pack strong{font-size:14px}.pack b{font-size:20px}.pack small{font-size:12px}}
.pack small{font-size:13px;color:var(--muted);line-height:1.3}
.pack[aria-pressed="true"]{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}
.tagb{position:absolute;top:-10px;left:12px;background:var(--signal);color:#fff;font-size:12px;font-weight:500;border-radius:999px;padding:2px 10px}
.sum{background:var(--tile);border-radius:16px;padding:16px 18px;margin-bottom:18px}
.sum dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14.5px}
.sum dt{color:var(--muted)}
.sum dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.sum .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.sum .tot b{font-size:24px;font-weight:600}
.small{color:var(--muted);font-size:13.5px;margin:8px 0 0}
.custom{margin-top:14px}
.chk{display:flex;gap:10px;align-items:center;font-size:15px}
.chk input{accent-color:var(--signal);width:18px;height:18px}
.err{color:var(--warn);font-size:14px;min-height:20px;margin:8px 0 2px}
.cta{background:var(--signal);color:#fff;border:0;border-radius:999px;padding:14px 28px;font-size:16.5px;font-weight:600}
.cta:hover{background:#0b5a42}
.place{width:100%}
.buy{display:none}
.done{background:var(--soft);border-radius:16px;padding:18px;margin-top:16px}
.done h3{font-size:20px;color:var(--signal)}
.done p{margin:6px 0 0}
.trust{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:14px;color:var(--muted)}
.trust span{display:flex;gap:6px;align-items:center}
.trust svg{width:16px;height:16px;color:var(--signal)}
.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}

@media (max-width:920px){
body{padding-bottom:100px}
.top{margin-bottom:16px}
.app{display:flex;flex-direction:column;align-items:stretch;gap:0}
.builder{display:contents}
.app>*,.intro,.step{min-width:0}
.intro{order:-2;margin-bottom:16px}
.intro .pricebig,.intro .trust{display:none}
.stagewrap{order:-1;position:sticky;top:0;z-index:20;background:var(--white);margin:0 -20px;padding:0 20px 10px;border-bottom:1px solid var(--line)}
.stage{aspect-ratio:auto;height:42vh;min-height:280px;max-height:none;border-radius:18px}
.setbar{margin-top:2px;padding:8px 6px 2px 0;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.setbar::-webkit-scrollbar{display:none}.slots{flex-wrap:nowrap}.slot{width:38px;height:38px;flex:none}.addp{height:38px;flex:none}.setlbl{flex:none;font-size:13px}.rmp{flex:none}
.toyview{right:33%;padding:5% 1% 5% 4%}
.again{left:10px;bottom:10px;padding:5px 12px;font-size:13px}
.hint{font-size:12px;bottom:52px}
.zoombtn{left:10px;top:10px;padding:5px 12px 5px 8px;font-size:13px}
.step:first-of-type{border-top:0}
.step:first-of-type{margin-top:6px}
.buy{display:flex;align-items:center;gap:14px;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--white);border-top:1px solid var(--line);padding:12px 20px max(12px,env(safe-area-inset-bottom,0px))}
.buy .pr{flex:1;min-width:0;line-height:1.2}
.buy .pr b{display:block;font-size:20px;font-weight:600}
.buy .pr span{font-size:13px;color:var(--muted)}
.fields{grid-template-columns:1fr}
.types{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.type{padding:12px 4px 10px}.type strong{font-size:14px}.type small{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>
<div class="wrap">
<header class="top">
<span class="brand">Interform <span>Tap Toys</span></span>
<div class="lang" role="group" aria-label="Language"><button data-a="lang" data-v="en" aria-pressed="true">EN</button><button data-a="lang" data-v="ua" aria-pressed="false">UA</button></div>
</header>

<div class="app">
<section class="stagewrap" id="stagewrap" aria-label="Preview">
<div class="stage" id="stageBox">
<div class="toyview" id="stage"></div>
<svg class="waves" viewBox="0 0 40 60" aria-hidden="true"><path d="M8 18a16 16 0 0 1 0 24M16 10a28 28 0 0 1 0 40M24 2a40 40 0 0 1 0 56" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
<div class="phoneview"><div class="phbox" id="phbox"><div class="phone" id="phone"><div class="screen" id="screen"></div></div></div></div>
<div class="hint" data-t="dragHint"></div>
<button class="zoombtn" id="zoomBtn" data-a="zoom" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12.8 12.8L17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M6 8.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path class="pl" d="M8.5 6v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span></span></button>
<button class="again" data-a="tap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12a5 5 0 0 1 10 0M4 12a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="15" r="2.2" fill="currentColor"/></svg><span data-t="tap"></span></button>
</div>

function fitText(){

  var T=tx[0].parentNode.getCTM(),inv=[];
  for(var i=0;i<fr.length;i++)inv.push(fr[i].getCTM().inverse().multiply(T));
  var base=[],mainY=null,mainFs=0;
  for(i=0;i<tx.length;i++){var main=tx[i].getAttribute("font-weight")==="800";var b={el:tx[i],fs:parseFloat(tx[i].getAttribute("font-size")),y:parseFloat(tx[i].getAttribute("y")),main:main,emb:main&&tx[i].getAttribute("opacity")===".28"};base.push(b);if(main&&mainY===null&&!b.emb){mainY=b.y;mainFs=b.fs;}}

  for(var s=1;s>=0.3;s*=0.93){
    var ok=true;
    for(i=0;i<base.length;i++){var b2=base[i];b2.el.setAttribute("font-size",(b2.fs*s).toFixed(2));
      if(!b2.main)b2.el.setAttribute("y",(mainY+mainFs*s*0.75+1).toFixed(2));

      for(var a=0;a<3&&ok;a++)for(var c=0;c<2&&ok;c++)if(!inside(xs[a],ys[c]))ok=false;

  if(a==="view"){setView(v,true);return;}
  if(a==="form"){st.form=v;st.zoom=false;renderForms();renderAddons();setView("toy");renderToy();renderSummary();bump();}
  else if(a==="shape"){st.shape=v;renderShapes();setView("toy");renderToy();renderSummary();bump();}
  else if(a==="finish"){st.finish=v;if(v==="wood")st.add.glow=false;renderFinish();renderAddons();setView("toy");renderToy();renderSummary();renderView();}
  else if(a==="color"){st.color=v;renderFinish();setView("toy");renderToy();}
  else if(a==="wood"){st.wood=v;renderFinish();setView("toy");renderToy();renderSummary();}
  else if(a==="sample"){st.photo=null;st.px=0;st.py=0;st.pz=1;renderToy();}
  else if(a==="preset"){st.px=0;st.py=0;st.pz=1;applyPhoto();}
  else if(a==="pack"){setCount(parseInt(v,10));if(v!=="1")$("inShip").value="2";renderSummary();}
  else if(a==="slot"){if(+v!==st.cur){st.items[st.cur]=snap();loadItem(+v);}}
  else if(a==="addp"){st.items[st.cur]=snap();if(st.items.length<20){st.items.push(variant(st.items.length));loadItem(st.items.length-1);}}
  else if(a==="rmp"){if(st.items.length>1){st.items.splice(st.cur,1);loadItem(Math.max(0,st.cur-1));}}
  else if(a==="cat"){st.cat=v;renderCats();}
  else if(a==="act"){st.action=v;st.i=0;renderCats();renderMsgField();renderSummary();if(st.view==="phone")showScreen(true);else setView("phone",true);}
  else if(a==="tap"){setZoom(true);showScreen(true);}
  else if(a==="zoom"){setZoom(!st.zoom);}
  else if(a==="goorder"){$("order").scrollIntoView({behavior:"smooth",block:"start"});setTimeout(function(){$("inName").focus({preventScroll:true});},450);}
  else if(a==="rand"){st.i=(st.i+1+Math.floor(Math.random()*3));showScreen(false);}
  else if(a==="yes"){$("screen").innerHTML=card("#c8323c","#fff","",LANG==="ua"?"Ура!":"Yay!",LANG==="ua"?"Заїжджаю о 19:00.":"Picking you up at 7.","");}
  else if(a==="no"){b.style.position="relative";b.style.transform="translate("+(Math.random()*90-45)+"px,"+(Math.random()*50-25)+"px)";}
});
document.addEventListener("change",function(e){var b=e.target;if(b.getAttribute&&b.getAttribute("data-a")==="add"){st.add[b.getAttribute("data-v")]=b.checked;setView("toy");renderToy();renderSummary();}});
function bind(id,fn){$(id).addEventListener("input",fn);}
bind("inText",function(e){st.text=e.target.value;setView("toy");renderToy();renderSummary();});
bind("inSub",function(e){st.sub=e.target.value;setView("toy");renderToy();renderSummary();});
bind("inTo",function(e){st.to=e.target.value;setView("phone");showScreen(false);});
bind("inFrom",function(e){st.from=e.target.value;setView("phone");showScreen(false);});
bind("inMsg",function(e){st.msg[st.action]=e.target.value;setView("phone");showScreen(false);});
$("inShip").addEventListener("change",renderSummary);
$("inCustom").addEventListener("change",function(e){st.custom=e.target.checked;$("ideaWrap").hidden=!st.custom;renderSummary();});
$("orderForm").addEventListener("submit",function(e){
  e.preventDefault();var name=$("inName").value.trim(),mail=$("inEmail").value.trim(),er=$("err"),c=$("confirm");er.textContent="";c.innerHTML="";
  if(!name){er.textContent=t("e1");$("inName").focus();return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){er.textContent=t("e2");$("inEmail").focus();return;}
  if(st.custom&&!$("inIdea").value.trim()){er.textContent=t("e3");$("inIdea").focus();return;}
  var pr=price(),id="TT-"+Math.floor(1000+Math.random()*9000);
  c.innerHTML='<div class="done" role="status"><h3>'+t("okT")+'</h3><p><b>'+id+'</b>, '+esc(name)+', '+pr.q+' '+t("pieces")+', '+money(pr.tot)+'</p><p>'+t("okP")+'</p></div>';
  c.scrollIntoView({behavior:"smooth",block:"center"});
});
window.addEventListener("resize",fitPhone);

/* ---------- sets: every piece in a set is its own design ---------- */
S.yourSet=["Your set","Твій набір"];S.pieceOf=["Piece N of M","Штука N з M"];S.addPiece=["Add piece","Додати"];S.removePiece=["Remove this piece","Прибрати цю штуку"];
S.setHint=["Build a set of 5 and get a discount and free delivery! Every piece can be different: its own shape, text and tap.","Збери набір з 5 і отримай знижку та безкоштовну доставку! Кожна штука може бути інша: своя форма, текст і дотик."];
S.extrasW=["extras","додатково"];S.pieces=["pieces","шт."];
var DK=["form","shape","finish","color","wood","photo","px","py","pz","text","sub","action","to","from","msg","add"];
function cp(o){return JSON.parse(JSON.stringify(o));}
function snap(){var o={};DK.forEach(function(k){o[k]=(k==="msg"||k==="add")?cp(st[k]):st[k];});return o;}
st.items=[snap()];st.cur=0;
var VAR=["star","snowman","bauble","gift","santa","heart","ginger","stocking","bell","mitten","house","bear","cat","dog","paw","crown","flake","drop","car","guitar"];
var VCOL=["#1f6b4a","#1c2a4a","#d9a21b","#c8323c","#7a4fc2","#ee7fa6","#4aa3df","#ef7b2a"];
function variant(i){var o=snap();o.shape=VAR[(i-1)%VAR.length];if(o.finish==="print")o.color=VCOL[(i-1)%VCOL.length];return o;}
function setCount(n){st.items[st.cur]=snap();if(n===1){st.items=[st.items[st.cur]];loadItem(0);return;}
  while(st.items.length<n)st.items.push(variant(st.items.length));
  if(st.items.length>n){st.items=st.items.slice(0,n);}
  loadItem(Math.min(st.cur,n-1));}
function loadItem(i){st.cur=i;var o=st.items[i];DK.forEach(function(k){st[k]=(k==="msg"||k==="add")?cp(o[k]):o[k];});
  $("inText").value=st.text;$("inSub").value=st.sub;$("inTo").value=st.to;$("inFrom").value=st.from;
  renderForms();renderShapes();renderFinish();renderAddons();renderCats();renderMsgField();renderToy();renderView();renderSummary();renderSet();bump();}
function chipColor(it){return it.finish==="print"?it.color:it.finish==="wood"?WOODS[it.wood].base:"#9a93b8";}
function renderSet(){
  var its=allItems(),n=its.length,h="";
  its.forEach(function(it,i){h+='<button class="slot" data-a="slot" data-v="'+i+'" aria-pressed="'+(i===st.cur)+'" aria-label="'+(i+1)+'"><svg viewBox="0 0 100 100" aria-hidden="true"><g fill="'+chipColor(it)+'">'+SH[it.shape].b+'</g></svg><i>'+(i+1)+'</i></button>';});
  $("slots").innerHTML=h;
  $("setLbl").textContent=n>1?t("pieceOf").replace("N",st.cur+1).replace("M",n):t("yourSet");
  $("rmp").hidden=n<2;
}
function sync(){st.items[st.cur]=snap();renderSet();renderSummary();}
var syncT=null;function syncSoon(){clearTimeout(syncT);syncT=setTimeout(sync,60);}
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a");
  if(["form","shape","finish","color","wood","sample","preset","act","add"].indexOf(a)>-1)syncSoon();});
document.addEventListener("input",function(e){if(["inText","inSub","inTo","inFrom","inMsg","inZoom"].indexOf(e.target.id)>-1)syncSoon();});
document.addEventListener("change",function(e){if(e.target.getAttribute&&e.target.getAttribute("data-a")==="add")syncSoon();});
$("stage").addEventListener("pointerup",syncSoon);$("stage").addEventListener("wheel",syncSoon);

renderAll();renderSet();
setTimeout(function(){setZoom(true);showScreen(true);},1400);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){renderToy();fitPhone();});
})();
</script>
